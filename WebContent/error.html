<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civic Connect | Oops!</title>
    <link rel="stylesheet" href="css/portal.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; color: #1a1a1a; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Inter', sans-serif; }
        .error-container { text-align: center; max-width: 500px; padding: 40px; background: white; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .error-icon { font-size: 5rem; color: #ff4757; margin-bottom: 20px; }
        h1 { font-size: 2rem; margin-bottom: 15px; }
        p { color: #64748b; line-height: 1.6; margin-bottom: 30px; }
        .back-btn { background: #007bff; color: white; border: none; padding: 12px 30px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; text-decoration: none; display: inline-block; }
        .back-btn:hover { background: #0056b3; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon"><i class="fas fa-exclamation-triangle"></i></div>
        <h1>System Alert</h1>
        <p>We encountered an unexpected behavior or the page you are looking for does not exist. The TAI system has logged this incident.</p>
        <a href="pages/dashboard.html" class="back-btn">Return to Dashboard</a>
    </div>
</body>
</html>
